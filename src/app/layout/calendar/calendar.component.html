<h2>Attending Events</h2>
<ul>
  <li *ngFor="let e of attendingEvents">
    {{ e.name }} – {{ e.date | date }}
  </li>
</ul>

<div *ngIf="role === 'EVENT_ORGANIZER'">
  <h2>Organizer Events</h2>
  <ul>
    <li *ngFor="let e of organizerEvents">
      {{ e.name }} – {{ e.date | date }}
    </li>
  </ul>
</div>

<div *ngIf="role === 'SERVICE_PRODUCT_PROVIDER'">
  <h2>Provider Bookings</h2>
  <ul>
    <li *ngFor="let b of providerBookings">
      Booking #{{ b.id }} – {{ b.serviceProductName }} ({{ b.date | date }})
    </li>
  </ul>
</div>
