<div class="container">
    <form [formGroup]="inputForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="fill">
        <mat-label>Category Name</mat-label>
        <input matInput placeholder="Enter category name" formControlName="name" />
        <mat-error *ngIf="inputForm.controls.name?.hasError('required')">
          This field is required.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Category Description</mat-label>
        <textarea matInput placeholder="Enter category description" formControlName="description" > </textarea>
        <mat-error *ngIf="inputForm.controls.description?.hasError('required')">
          This field is required.
        </mat-error>
      </mat-form-field>
  
      <div class="button-group">
        <button mat-raised-button color="primary" type="submit">Save</button>
        <button mat-raised-button color="warn" type="button" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  </div>
