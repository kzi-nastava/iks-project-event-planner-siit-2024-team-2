<div class="table-wrap mat-elevation-z4">
  <h3>Price list</h3>
  <table mat-table [dataSource]="priceList" class="w-full" matSort>

    <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let row; let i = index">
        {{ i + 1 }}
        </td>
    </ng-container>

    <!-- Name -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
      <td mat-cell *matCellDef="let row">
        <div class="cell-primary">{{ row.name }}</div>
      </td>
    </ng-container>

    <!-- Price -->
    <ng-container matColumnDef="price">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Price </th>
    <td mat-cell *matCellDef="let row; let i = index" [formGroup]="forms[i]">
        <input matInput type="number" formControlName="price" class="small-input">
    </td>
    </ng-container>

    <!-- Discount -->
    <ng-container matColumnDef="discount">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Discount </th>
    <td mat-cell *matCellDef="let row; let i = index" [formGroup]="forms[i]">
        <input matInput type="number" formControlName="discount" class="small-input">
    </td>
    </ng-container>

    <!-- Total -->
    <ng-container matColumnDef="total">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Total </th>
      <td mat-cell *matCellDef="let row" class="muted">{{ row.total }}</td>
    </ng-container>

    <!-- Save -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="text-right"> Save </th>
      <td mat-cell *matCellDef="let row let i = index" class="text-right">
        <button mat-icon-button class="btn-save" matTooltip="Save" (click)="save(row, i)">
        <mat-icon>check</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Invalid -->
    <ng-container matColumnDef="invalid">
      <th mat-header-cell *matHeaderCellDef class="text-right"> Validator </th>
      <td mat-cell *matCellDef="let row let i = index" class="text-right">
        <mat-error *ngIf="forms[i].invalid">
          invalid
        </mat-error>
        <mat-error *ngIf="forms[i].invalid">
          form
        </mat-error>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns" class="sticky"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
<button class="fancy-button" (click)="downloadPdf()" style="margin: 20px 0 0 10px;">Download PDF</button>
<button class="fancy-button back" (click)="back()" style="margin: 20px 0 0 10px;">Back</button>
