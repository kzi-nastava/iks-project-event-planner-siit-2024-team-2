<div class="row" id="all" [formGroup]="createEventForm">
    <div id="left-div">
      <mat-form-field appearance="fill">
        <mat-label>Event Type</mat-label>
        <mat-select formControlName="eventType">
          <mat-option *ngFor="let eventType of eventTypes" [value]="eventType.id">
            {{ eventType.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>
  
      <div class="form-container">
      <label for="name" class="form-label">Name:</label>
      <input type="text" id="name" class="form-input" placeholder="Enter the name" formControlName="name">
      <div *ngIf="createEventForm.get('name')?.invalid && createEventForm.get('name')?.touched" class="error-message">
        <span *ngIf="createEventForm.get('name')?.errors?.['required']">Name is required.</span>
        <span *ngIf="createEventForm.get('name')?.errors?.['minlength']">Name must be at least 1 character.</span>
      </div>

  
      <label for="description" class="form-label">Description:</label>
      <textarea id="description" class="form-input" placeholder="Enter the description" formControlName="description"></textarea>
      <div *ngIf="createEventForm.get('description')?.invalid && createEventForm.get('description')?.touched" class="error-message">
        <span *ngIf="createEventForm.get('description')?.errors?.['required']">Description is required.</span>
        <span *ngIf="createEventForm.get('description')?.errors?.['minlength']">Description must be at least 1 character.</span>
      </div>


  
      <label for="max-attendances" class="form-label">Max Attendances:</label>
      <input type="number" id="max-attendances" class="form-input" placeholder="Enter Max attendances" formControlName="maxAttendances">
      <div *ngIf="createEventForm.get('maxAttendances')?.invalid && createEventForm.get('maxAttendances')?.touched" class="error-message">
        <span *ngIf="createEventForm.get('maxAttendances')?.errors?.['required']">Max attendances is required.</span>
      </div>

  
        <label for="is-open" class="form-label">Is the event open to everyone?</label>
        <input type="checkbox" id="is-open" class="form-checkbox" formControlName="open">

        <label for="agenda" class="form-label" style="margin-top: 30px;">See detailed agenda:</label>
        <button
          mat-button
          type="button"
          (click)="openAgenda()"
          style="background-color: #f5f5f5;"
          [disabled]="id === -1"
          matTooltip="Finish creating the event to access the agenda"
          [matTooltipDisabled]="id !== -1"
        >
          Agenda
        </button>
      </div>
    </div>
  
    <div id="right-div">
      <app-map 
        (coordinatesSelected)="onCoordinatesSelected($event)" 
        [readonly]="false" 
        [latitude]="createEventForm.value.latitude!" 
        [longitude]="createEventForm.value.longitude!">
      </app-map>
      <div class="form-container">
        <label for="date" class="form-label">Date:</label>
        <input type="date" id="date" class="form-input" formControlName="date">
        <div *ngIf="createEventForm.get('date')?.invalid && createEventForm.get('date')?.touched" class="error-message">
          <span *ngIf="createEventForm.get('date')?.errors?.['required']">Date is required.</span>
        </div>
      </div>
    </div>
  </div>
  
    
<div class="row" id="end">
    <button (click)="createEvent()" class="new">Save</button>
    <button (click)="onCancel()" class="new" id="cancel">Cancel</button>
</div>
