<mat-toolbar color="primary">
  <button [class.hidden]="!isLoggedIn || isLoading" mat-icon-button (click)="toggleSidenav()">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="toolbar-title" [routerLink]="['home']">Event Planner</span>
  <div class="toolbar-actions" *ngIf="!isLoading">
    <a mat-button *ngIf="!isLoggedIn" [routerLink]="['signin']" class="custom-signin-button">Sign in</a>
    <button mat-button *ngIf="isLoggedIn" (click)="signOut()" class="custom-signin-button">Sign out</button>
      <mat-icon [routerLink]="['profile']">account_circle</mat-icon>
  </div>
</mat-toolbar>


<mat-sidenav-container [class.hidden]="!isLoggedIn || isLoading" class="sidenav-container secondary">
  <mat-sidenav #sidenav mode="side" class="secondary" [opened]="toggle">
    <mat-nav-list class="secondary">
      <mat-list-item [routerLink]="['home']" color="primary">
        <mat-icon>home</mat-icon>
        Home
      </mat-list-item>
      <mat-list-item [routerLink]="['chat']">
        <mat-icon>chat</mat-icon>
        Chat
      </mat-list-item>
      <mat-list-item [routerLink]="['notifications']">
        <mat-icon >notifications</mat-icon>
        <p matBadgeOverlap="false" matBadge="{{badgeCount$ | async}}" [matBadgeHidden]="!(badgeCount$ | async)" matBadgeColor="accent" matBadgePosition="above after">Notifications</p>
      </mat-list-item>
      <mat-list-item [routerLink]="['calendar']">
        <mat-icon>calendar_today</mat-icon>
        Calendar
      </mat-list-item>
      <mat-list-item *ngIf="hasRole(['SERVICE_PRODUCT_PROVIDER', 'ADMIN'])" [routerLink]="['new-service']">
        <mat-icon>add</mat-icon>
        New service
      </mat-list-item>
      <mat-list-item *ngIf="hasRole(['SERVICE_PRODUCT_PROVIDER', 'ADMIN'])" [routerLink]="['new-product']">
        <mat-icon>add</mat-icon>
        New product
      </mat-list-item>
      <mat-list-item *ngIf="hasRole(['SERVICE_PRODUCT_PROVIDER', 'ADMIN'])" [routerLink]="['my-services']">
        <mat-icon>handshake</mat-icon>
        My services
      </mat-list-item>
      <mat-list-item *ngIf="hasRole(['SERVICE_PRODUCT_PROVIDER', 'ADMIN'])" [routerLink]="['my-products']">
        <mat-icon>handshake</mat-icon>
        My products
      </mat-list-item>
      <mat-list-item *ngIf="hasRole(['ADMIN'])" [routerLink]="['new-event-type']">
        <mat-icon>add</mat-icon>
        New Event Type
      </mat-list-item>
      <mat-list-item *ngIf="hasRole(['EVENT_ORGANIZER', 'ADMIN'])" [routerLink]="['new-event']">
        <mat-icon>add</mat-icon>
        New event
      </mat-list-item>
            <mat-list-item *ngIf="hasRole(['EVENT_ORGANIZER', 'ADMIN'])" [routerLink]="['my-events']">
        <mat-icon>handshake</mat-icon>
        My events
      </mat-list-item>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
