<h2 mat-dialog-title>Filters:</h2>
<mat-dialog-content>
  <div class="form-container">
    <mat-button-toggle-group name="serviceProductType" aria-label="Service Product Type" multiple [formControl]="serviceProductType" (change)="onTypeChanged($event)">
        <mat-button-toggle value="SERVICE">Service</mat-button-toggle>
        <mat-button-toggle value="PRODUCT">Product</mat-button-toggle>
    </mat-button-toggle-group>
    <mat-form-field>
      <mat-label>Category:</mat-label>
      <mat-select [formControl]="categories" multiple>
        @for (category of allCategories; track category) {
          <mat-option [value]="category">{{category.name}}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-label class="slider-label">Price (€):</mat-label>
    <mat-slider [min]="priceRange[0]" [max]="priceRange[1]"
      step="1" discrete class="hide-ripple" [disabled]="disabledPriceSlider" [displayWith]="formatPrice">
      <input matSliderStartThumb [(value)]="data.filter.minPrice">
      <input matSliderEndThumb [(value)]="data.filter.maxPrice"> 
    </mat-slider>
    <mat-form-field>
      <mat-label>Available Event Types:</mat-label>
      <mat-select [formControl]="eventTypes" multiple>
        @for (eventType of allEventTypes; track eventType) {
          <mat-option [value]="eventType">{{eventType.name}}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <div fxLayout="column" [hidden]="selectedDType != 'SERVICE'" class="service-options">
        <mat-label class="slider-label">Duration:</mat-label>
        <mat-slider [min]="durationRange[0]" [max]="durationRange[1]"
        step="0.5" discrete class="hide-ripple" [disabled]="disabledDurationSlider" [displayWith]="formatDuration">
        <input matSliderStartThumb [(value)]="data.filter.minDuration">
        <input matSliderEndThumb [(value)]="data.filter.maxDuration"> 
        </mat-slider>
        <mat-checkbox labelPosition="after" (click)="onCheckboxClick()"
            [checked]="checked" [indeterminate]="indeterminate">Automatic Reservation: </mat-checkbox>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-dialog-close mat-button>Cancel</button>
  <button type="submit" (click)="applyFilter()" mat-dialog-close mat-button>Apply</button>
</mat-dialog-actions>
