<h2 mat-dialog-title>Account Suspended</h2>
<mat-dialog-content color="primary">
    <p>
        Your account has been temporarily suspended due to a violation of our community guidelines.
    </p>
    <p>
        The suspension will be lifted {{ suspendedFor }}.
    </p>
</mat-dialog-content>

<mat-dialog-actions>
    <button mat-flat-button mat-dialog-close color="primary">Close</button>
</mat-dialog-actions>
