<div class="chat-layout">
  <!-- Sidebar -->
  <div class="chat-sidebar">
    <h3>Chats</h3>
    <ul>
      <li *ngFor="let myChat of myChats" 
          (click)="selectChat(myChat)" 
          [class.active]="myChat.id === chat?.id">
        @if (myChat.user1.id === myId) {
          <p>{{ myChat.user2.firstName }} {{ myChat.user2.lastName }}</p>
        }
        @else {
          <p>{{ myChat.user1.firstName }} {{ myChat.user2.lastName }}</p>
        }
      </li>
    </ul>
  </div>

<!-- Chat window -->
  <div class="chat-window" *ngIf="chat">
    <h3>{{ chat.user2.firstName }}</h3>

    <div class="messages">
      <div *ngFor="let msg of chat.messages" [class.mine]="msg.toUser.id === chat.user1.id">
        {{ msg.text }}
      </div>
    </div>

    <div class="input-area">
      <input [(ngModel)]="newMessage" placeholder="Type a message..." />
      <button mat-flat-button color="primary" (click)="sendMessage()">Send</button>
    </div>
  </div>
</div>
