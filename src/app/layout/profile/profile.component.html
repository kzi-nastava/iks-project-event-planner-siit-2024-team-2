<div class="profile-container">
  <div class="profile-header">
    <img 
      [src]="profilePreview || userInfo.image || 'assets/default-profile.jpg'" 
      alt="Profile Picture" 
      class="profile-picture">

    <div class="profile-picture-actions">
      <input type="file" accept="image/*" (change)="onFileSelected($event)">
      <button *ngIf="selectedFile" (click)="uploadProfilePicture()">Save New Picture</button>
      <button *ngIf="userInfo.image" (click)="removeProfilePicture()">Remove Picture</button>
    </div>

    <h1>{{ userInfo.firstName }} {{ userInfo.lastName }}</h1>
    <p>{{ userInfo.email }}</p>
  </div>


  <div class="profile-sections">
    <!-- Personal Information Section -->
    <div class="profile-section">
      <h2>Personal Information</h2>
      <form (ngSubmit)="updatePersonalInfo()">
        <div class="form-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="userInfo.email" name="email" disabled>
        </div>
        <div class="form-group">
          <label>First Name</label>
          <input type="text" [(ngModel)]="userInfo.firstName" name="firstName" required [disabled]="!showAllProfileData">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" [(ngModel)]="userInfo.lastName" name="lastName" required [disabled]="!showAllProfileData">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" [(ngModel)]="userInfo.phoneNumber" name="phone" [disabled]="!showAllProfileData">
        </div>
        <div class="form-group">
          <label>Address</label>
          <input type="text" [(ngModel)]="userInfo.address" name="address" [disabled]="!showAllProfileData">
        </div>
        <button type="submit" *ngIf="showAllProfileData">Update Personal Info</button>
      </form>
    </div>

    <!-- Company Information Section (for PUP) -->
    <div class="profile-section" *ngIf="userRole === 'SERVICE_PRODUCT_PROVIDER'">
      <h2>Company Information</h2>
      <form (ngSubmit)="updateCompanyInfo()">
        <div class="form-group">
          <label>Company Name</label>
          <input type="text" [(ngModel)]="companyInfo.companyName" name="companyName" disabled>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea [(ngModel)]="companyInfo.companyDescription" name="description" [disabled]="!showAllProfileData"></textarea>
        </div>
        <button type="submit" *ngIf="showAllProfileData">Update Company Info</button>
        <button type="button" *ngIf="!showAllProfileData" (click)="goBack()">Back</button>
      </form>

      <div *ngIf="showAllProfileData">
      <h3>Service Categories</h3>
      <ul>
        <li *ngFor="let category of serviceCategories">{{ category }}</li>
      </ul>

      <h3>Event Types</h3>
      <div *ngFor="let type of eventTypes">
        <label>
          <input type="checkbox" 
                 [checked]="selectedEventTypes.includes(type)"
                 (change)="updateEventTypes()"
                 [(ngModel)]="selectedEventTypes"
                 [value]="type">
          {{ type }}
        </label>
      </div>
      </div>
    </div>

    <!-- Change Password Section -->
    <div *ngIf="showAllProfileData">
    <div class="profile-section" *ngIf="userRole !== 'AUTHENTICATED'">
      <h2>Change Password</h2>
      <form (ngSubmit)="changePassword()">
        <div class="form-group">
          <label>Old Password</label>
          <input type="password" [(ngModel)]="oldPassword" name="oldPassword" required>
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" [(ngModel)]="newPassword" name="newPassword" required>
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required>
        </div>
        <button type="submit">Change Password</button>
      </form>
    </div>

    <!-- Account Deactivation -->
    <div class="profile-section danger-zone">
      <h2>Account Settings</h2>
      <button type="button" class="danger-button" (click)="deactivateAccount()">

      </button>
      <p>Note: Deactivating your profile cannot be undone.</p>
