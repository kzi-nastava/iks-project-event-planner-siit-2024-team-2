<h2 mat-dialog-title>Are you sure?</h2>
    <mat-dialog-content>
      <p>Do you really want to delete this {{this.entityName}}? This process can not be undone.</p>
    </mat-dialog-content>
    <mat-dialog-actions>
      <button mat-button (click)="onConfirm()" id="delete" class="fancy-button" >Yes, delete</button>
      <button mat-button (click)="onCancel()" class="fancy-button">No, stay</button>
    </mat-dialog-actions>
